name: FanPulse
options:
  bundleIdPrefix: app.fanpulse
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: 1,2
targets:
  FanPulse:
    type: application
    platform: iOS
    sources:
    - Black
    - FanPulse
    - WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fanpulse.local
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Fan Pulse
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en_GB
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: Support/App.entitlements
        INFOPLIST_FILE: Support/AppInfo.plist
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
    info:
      path: Support/AppInfo.plist
      properties:
        CFBundleDevelopmentRegion: en_GB
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connect to your local Fan Pulse league server.
        CFBundleURLTypes:
        - CFBundleURLName: app.fanpulse.local.widget
          CFBundleURLSchemes:
          - fanpulse
    dependencies:
    - target: FanPulseWidget
      embed: true
  FanPulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    - WidgetTests/WidgetIntegrationTests.swift
    dependencies:
    - target: FanPulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.fanpulse.local.uitests
  FanPulseWidget:
    type: app-extension
    platform: iOS
    sources:
    - WidgetShared
    - WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fanpulse.local.widget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Support/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
  FanPulseWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - WidgetTests/WidgetTests.swift
    dependencies:
    - target: FanPulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.fanpulse.local.widgettests
schemes:
  FanPulse:
    build:
      targets:
        FanPulse: all
    test:
      targets:
      - FanPulseUITests
      - FanPulseWidgetTests
